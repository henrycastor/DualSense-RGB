[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dualsense-rgb"
version = "2.0.0"
description = "Bridge DualSense lightbar colors to OpenRGB via usbmon, with libevdev idle inhibition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = []
keywords = ["dualsense", "openrgb", "usbmon", "rgb", "lightbar", "libevdev", "evdev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "openrgb-python>=0.3.6",
    "pyevdev>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
dualsense-rgb = "dualsense_rgb.cli:main_cli"

[project.urls]
Homepage = "https://github.com/henry/DualSense-RGB"
Repository = "https://github.com/henry/DualSense-RGB"

[tool.setuptools.packages.find]
where = ["."]
include = ["dualsense_rgb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
